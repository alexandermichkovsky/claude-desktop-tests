name: Claude Desktop E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e-tests:
    # Self-hosted runner on a Windows 10/11 machine with Claude Desktop
    # already installed as an AppX package (Windows Store version).
    # Setup: GitHub → Settings → Actions → Runners → New self-hosted runner
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm test
        timeout-minutes: 20

      # Visual regression baselines are committed to the repo under
      # test-screenshots/baseline/. On first CI run they are created
      # automatically; subsequent runs diff against them.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots (baseline + diffs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-screenshots/
          retention-days: 30
